<html>
    <head>
        <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    </head>
    <body>
        <a-scene backgound="#04030F" light="defaultLightsEnabled: false">
            <a-assets>
                <img id="sky" src="https://thumbs.dreamstime.com/b/degree-space-nebula-panorama-equirectangular-projection-environment-map-hdri-spherical-background-stars-d-illustration-135988315.jpg">
                <img id="platform" src="platform.jpg">
                <img id="jyp" src="jyp.jpg">
                <img id="cry" src="cry.jpg">
                <img id="pretty" src="pretty.jpg">
            </a-assets>
            <a-sky src="#sky"></a-sky>
            <a-sphere material="shader: flat" position="0 0 -50"  light="type: point; color: #EAE9E6" radius="60.8" ></a-sphere>
            <a-entity 
                rotation="0 0 -50" position="0 0 -50" 
                animation="property: rotation.y; to: 360; loop: true; dur: 10000; easing: linear">
                <a-text 
                value="Cry"
                color="#BBB"
                position="0 40 100"
                scale=" 50 50 50" ></a-text>
                <a-sphere
                    position="0 0 100" 
                    color="#EAE9E6" 
                    src="#cry"  
                    radius="25.4"
                    animation="property: rotation.y; to: 360; loop: true; dur: 10000; easing: linear" >
                </a-sphere>

            </a-entity>   
            <a-entity 
            position="0 0 -50"
            value="Pretty"
            rotation="0 0 -50" 
            animation="property: rotation.y; to: 360; loop: true; dur: 10000; easing: linear">
            <a-text
            value="Pretty"
            color="#BBB"
            position="0 40 200"
            scale = "50 50 50"></a-text>
            <a-sphere position="0 0 200" color="#EAE9E6" src="#pretty" radius="30.7" animation="property: rotation.y; to: 360; loop: true; dur: 10000; easing: linear"></a-sphere>
            </a-entity>
            <a-entity 
            position="0 0 -50"
            rotation="0 0 -50" 
            animation="property: rotation.y; to: 360; loop: true; dur: 10000; easing: linear">
            <a-text
            value="JYP"
            color="#BBB"
            position="0 40 350"
            scale="50 50 50"> </a-text>
            <a-sphere position="0 0 350" color="#EAE9E6"  radius="30.4" src="#jyp" radius="40.4" animation="property: rotation.y; to: 360; loop: true; dur: 10000; easin: linear "></a-sphere>
            <a-torus
                radius="0.1" color="" segments-tubular="50" radius="1.5" radius-tubular="0.081">
            
            </a-torus>

            </a-entity>
        </a-scene>
    </body>
</html>
