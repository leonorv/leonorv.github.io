<html>
   <head>
      <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
      <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
   </head>
   <body>
    
    <a-assets>
      <a-asset-item id="codey" src="./imagens-curso VR/codey.gltf"> </a-asset-item>
      <a-asset-item id="hand" src="Hand.gltf"> </a-asset-item>
      <a-asset-item id="gnof" src="gnof.gltf"> </a-asset-item>
    </a-assets>
  
    <a-scene background="color: #83E67A">
       <a-entity environment="preset: goaland; shadow: true; lighting: blue" > </a-entity>
        
        <a-gltf-model 
          src="#codey"
          position="0 40 -3"
          scale="20 20 20"
          position="-1 1.6 -5"
         animation="property: position; to: 1 8 -10; dur: 2000; easing: linear; loop: true; dir:alternate;">
        </a-gltf-model>
        <a-gltf-model
        src="#hand"
        rotation="180"
        position="100 100 -3"
        scale="500 500 500"
        position="-1 1.6 -5"
         animation="property: position; to: 1 8 -10; dur: 2000; easing: linear; loop: true; dir:alternate;"> </a-gltf-model>
         <a-gltf-model
        src="#gnof"
        
        position="-200 100 3"
        scale="100 100 100"
        position="-1 1.6 -5"
         animation="property: position; to: 1 8 -10; dur: 2000; easing: linear; loop: true; dir:alternate;"> </a-gltf-model><a-text
        value="Goodbye, Kid"
          color="white"
          position="0 80 -3"
          scale="50 50 50">
        </a-text>
          <a-box
         color= "#53C7FF"
         position= "9 3 5"
         rotation= "2 -1 5">
          </a-box>
        <a-circle 
        src="#platform"
       radius="30" 
       rotation="-90 0 0"
        color= "#2DC1F7"
        position=" 5 -1 1">
      
      </a-circle>

        <a-box  
        position="-1 1.6 -5" 
        animation="property: position; to: 1 8 -10; dur: 2000; easing: linear; loop: true"
         color="tomato"
         dir: alternate;></a-box>
         <a-entity light="color: #black; intensity: 1.5" position="-1 1 0"></a-entity>
         <a-entity light="type: ambient; color: ##2CF26C"></a-entity>
         <a-entity light="type: directional; color: #2CF26C; intensity: 0.1" position="-0.5 1 1"></a-entity>
         

        
     </a-scene>
   </body> 
</html>
