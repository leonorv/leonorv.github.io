<html> 
    <head>
        <script src="https://aframe.io/releases/1.2.0/aframe.min.js"> </script>
        <script src="https://gftruj.github.io/webzamples/aframe/controls/oculus-thumbstick-controls.js"></script>
    </head>
    <body> 
        <a-scene>
            <a-assets>
                <img id="sea" src="sea.jpg">
                <img id="sky" src="sky.jpg">
                <img id="grass" src="grass.jpg">
                <a-asset-item id="tree" src="model (3).gltf"> </a-asset-item>
           </a-assets>

           <a-entity id="rig">
            <a-camera position="0 1.6 0"></a-camera>
            <a-entity oculus-touch-controls="hand: left" ></a-entity>
            <a-entity oculus-touch-controls="hand: right" oculus-thumbstick-controls></a-entity>
          </a-entity>
            
            <a-plane  
             src="#sea" 
             height="20" 
             width="20" 
             rotation="-90 0 0"></a-plane>
            <a-sky 
             src="#sky"></a-sky>
            <a-box
             depth="0.5" 
             src="#grass" 
             position="-5 0.2 0" 
             rotation="-90 0 0" 
             height="20" 
             width="12.5"> </a-box>
            <a-box
             depth="0.2" 
             color= "#7D2B11"
             position="6 0.1 0" 
             rotation="90 -135 0" 
             height="3" 
             width="5">
            </a-box>
            </a-box>
            <a-box
            depth="0.2" 
            color= "#7D2B11"
            position="5 0.5 -1" 
            rotation="0 -135 0" 
            height="1" 
            width="5">
            <a-box
            depth="0.2" 
            color= "#7D2B11"
            position="0 0 -3"
            rotation="0 180 0" 
            height="1" 
            width="5">
           </a-box>
           <a-box
           depth="0.2" 
           color= "#7D2B11"
           position="2.5 0 -1.5"
           rotation="0 90 0" 
           height="1" 
           width="3">
          </a-box>
          <a-box
          depth="0.2" 
          color= "#7D2B11"
          position="-2.5 0 -1.5"
          rotation="0 90 0" 
          height="1" 
          width="3">
         </a-box>
         <a-box
          depth="0.2" 
          color= "#7D2B11"
          position="0.9 0 -1.5"
          rotation="90 90 0" 
          height="1" 
          width="3">
         </a-box>
         <a-box
          depth="0.2" 
          color= "#7D2B11"
          position="1 0 -1.5"
          rotation="90 90 0" 
          height="1" 
          width="3">
         </a-box>
         <a-gltf-model
        src="#tree"
        rotation="0"
        position="5 0 9"
        scale=" 0.5 0.5 0.5">
        </a-gltf-model>
        <a-gltf-model
        src="#tree"
        rotation="0"
        position="10 0 8"
        scale=" 0.5 0.5 0.5">
        </a-gltf-model>
        <a-gltf-model
        src="#tree"
        rotation="0"
        position="13 0 6"
        scale=" 0.5 0.5 0.5">
        </a-gltf-model>
        <a-gltf-model
        src="#tree"
        rotation="0"
        position="15 0 5"
        scale=" 0.5 0.5 0.5">
        </a-gltf-model>
        <a-gltf-model
        src="#tree"
        rotation="0"
        position="13 0 3"
        scale=" 0.5 0.5 0.5">
        </a-gltf-model>
        <a-gltf-model
        src="#tree"
        rotation="0"
        position="12 0 -2"
        scale=" 0.5 0.5 0.5">
        </a-gltf-model>
        
         
        
        </a-scene>
    </body>
</html>
