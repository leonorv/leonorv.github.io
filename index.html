<html>
    <head>
        <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
        <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
        <script src="https://gftruj.github.io/webzamples/aframe/controls/oculus-thumbstick-controls.js"></script>
    </head>

    <body>

        
        <a-scene background="color: azure" light="defaultLightsEnabled: false">
            <a-assets>
                <img id="grass" src="grass.jpg">
                <a-asset-item id="codey" src="rick_astley/scene.gltf"></a-asset-item>
            </a-assets>

              <!-- Camera + controllers rig -->
  <a-entity id="rig">
    <a-camera position="0 1.6 0"></a-camera>
    <a-entity oculus-touch-controls="hand: left" ></a-entity>
    <a-entity oculus-touch-controls="hand: right" oculus-thumbstick-controls></a-entity>
  </a-entity>

            <a-entity environment="preset: yavapai; skyColor: red; lighting: none; shadow: true; groundColor: black"></a-entity>

            <a-gltf-model 
                src="#codey" 
                position="0 1 -3"
                scale="0.05 0.05 0.05"
                animation="
                        property: position; 
                        from: -10 0.5 -5;
                        to: 1 0.5 -10; 
                        dur: 2000; 
                        dir: alternate;
                        easing: linear; 
                        elasticity: 600;
                        loop: true">
            </a-gltf-model>

            <a-text
                value="Hello World!"
                color="yellow"
                position="0 10 -3"
                scale="3 3 3"
                align="left">
            </a-text>


            <a-light
                type="point"
                color="blue"
                position = "1 2 -6"
                intensity="2"
            >

            </a-light>

            <a-light type="directional" position="0 0 0" rotation="-90 0 0" target="#directionaltarget">
                <a-entity id="directionaltarget" position="0 0 -1"></a-entity>
              </a-light>
            


        </a-scene>
    </body>


</html>
